openapi: 3.0.3
info:
  title: Digital Nepal Ecosystem API
  version: 1.0.0
  description: Complete API catalog. The deployed context path is `/api`.
servers:
  - url: /api
    description: Current backend host and port
tags:
  - {name: Authentication}
  - {name: Approvals}
  - {name: Citizens}
  - {name: Households}
  - {name: Employment}
  - {name: Foreign Employment}
  - {name: Grievances}
  - {name: ID Cards}
  - {name: Synchronization}
  - {name: Audit}
  - {name: Operations}
paths:
  /v1/auth/login:
    post: {tags: [Authentication], security: [], summary: Login, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}, responses: {'200': {description: JWT tokens}, '401': {description: Invalid credentials}}}
  /v1/auth/refresh:
    post: {tags: [Authentication], security: [], summary: Refresh token, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshTokenRequest'}}}}, responses: {'200': {description: Refreshed token}}}
  /v1/auth/logout:
    post: {tags: [Authentication], summary: Logout, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LogoutRequest'}}}}, responses: {'204': {description: Logged out}}}
  /v1/auth/me:
    get: {tags: [Authentication], summary: Current user, responses: {'200': {description: User profile}}}
  /v1/approvals:
    post: {tags: [Approvals], summary: Submit citizen edit request, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Approval request}}}
  /v1/approvals/{id}/approve:
    post: {tags: [Approvals], summary: Approve edit request, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Approved}}}
  /v1/approvals/{id}/reject:
    post: {tags: [Approvals], summary: Reject edit request, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Rejected}}}
  /v1/approvals/pending:
    get: {tags: [Approvals], summary: Pending approvals, responses: {'200': {description: Pending approvals}}}
  /v1/citizens/register:
    post: {tags: [Citizens], summary: Register citizen, description: Requires WARD_ADMIN or LOCAL_BODY_ADMIN., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CitizenRegistrationRequest'}}}}, responses: {'200': {description: Registered citizen}, '400': {description: Validation error}, '403': {description: Role denied}}}
  /v1/citizens/{id}/eligibility:
    get: {tags: [Citizens], summary: Check eligibility, description: Requires WARD_ADMIN or LOCAL_BODY_ADMIN., parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Eligibility result}}}
  /v1/citizens/{id}/family:
    get: {tags: [Citizens], summary: Family tree, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Family tree}}}
  /v1/citizens/{id}/audit-log:
    get: {tags: [Audit], summary: Citizen audit log, description: Requires LOCAL_BODY_ADMIN or CENTRAL_ADMIN., parameters: [{$ref: '#/components/parameters/Id'}, {name: page, in: query, schema: {type: integer, default: 0}}, {name: size, in: query, schema: {type: integer, default: 20, maximum: 50}}], responses: {'200': {description: Audit page}}}
  /v1/households:
    post: {tags: [Households], summary: Create household, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Household}}}
  /v1/households/{id}:
    get: {tags: [Households], summary: Get household, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Household}}}
    put: {tags: [Households], summary: Update household, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Household}}}
    delete: {tags: [Households], summary: Delete household, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'204': {description: Deleted}}}
  /v1/households/ward/{wardId}:
    get: {tags: [Households], summary: Households by ward, parameters: [{$ref: '#/components/parameters/WardId'}], responses: {'200': {description: Households}}}
  /v1/households/head/{citizenId}:
    get: {tags: [Households], summary: Household by head, parameters: [{$ref: '#/components/parameters/CitizenId'}], responses: {'200': {description: Household}}}
  /v1/employment:
    post: {tags: [Employment], summary: Create employment profile, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Employment profile}}}
  /v1/employment/{citizenId}:
    get: {tags: [Employment], summary: Get employment profile, parameters: [{$ref: '#/components/parameters/CitizenId'}], responses: {'200': {description: Employment profile}}}
  /v1/foreign-employment:
    post: {tags: [Foreign Employment], summary: Create foreign employment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Foreign employment}}}
  /v1/foreign-employment/{id}:
    get: {tags: [Foreign Employment], summary: Get foreign employment, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Foreign employment}}}
    put: {tags: [Foreign Employment], summary: Update foreign employment, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Foreign employment}}}
    delete: {tags: [Foreign Employment], summary: Delete foreign employment, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'204': {description: Deleted}}}
  /v1/foreign-employment/citizen/{citizenId}:
    get: {tags: [Foreign Employment], summary: Foreign employment by citizen, parameters: [{$ref: '#/components/parameters/CitizenId'}], responses: {'200': {description: Foreign employment records}}}
  /v1/grievances:
    post: {tags: [Grievances], summary: File grievance, description: Requires WARD_ADMIN or LOCAL_BODY_ADMIN., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Grievance}}}
  /v1/grievances/{id}/status:
    patch: {tags: [Grievances], summary: Transition grievance, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Grievance}}}
  /v1/grievances/{id}/escalate:
    post: {tags: [Grievances], summary: Escalate grievance, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Escalated grievance}}}
  /v1/grievances/{id}/reject:
    post: {tags: [Grievances], summary: Reject grievance, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Rejected grievance}}}
  /v1/idcards/initiate:
    post: {tags: [ID Cards], summary: Initiate ID card, description: Requires WARD_ADMIN or LOCAL_BODY_ADMIN., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: ID card request}}}
  /v1/idcards/{id}/approve:
    patch: {tags: [ID Cards], summary: Approve ID card PDF, description: Requires LOCAL_BODY_ADMIN., parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}}}
  /v1/idcards/verify/{token}:
    get: {tags: [ID Cards], security: [], summary: Verify QR token, parameters: [{name: token, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Verification result}}}
  /v1/sync/submit:
    post: {tags: [Synchronization], summary: Submit sync batch, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Sync response}}}
  /v1/sync/batch/{id}/status:
    get: {tags: [Synchronization], summary: Sync batch status, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Batch status}}}
  /v1/sync/status/{wardId}:
    get: {tags: [Synchronization], summary: Ward sync status, parameters: [{$ref: '#/components/parameters/WardId'}], responses: {'200': {description: Ward status}}}
  /v1/sync/conflicts/{id}/resolve:
    post: {tags: [Synchronization], summary: Resolve sync conflict, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericRequest'}}}}, responses: {'200': {description: Conflict response}}}
  /v1/sync/conflicts:
    get: {tags: [Synchronization], summary: List sync conflicts, parameters: [{name: wardId, in: query, schema: {type: string, format: uuid}}, {name: status, in: query, schema: {type: string}}], responses: {'200': {description: Conflicts}}}
  /actuator/health:
    get: {tags: [Operations], summary: Health, responses: {'200': {description: Health status}, '403': {description: Authentication required}}}
  /actuator/info:
    get: {tags: [Operations], summary: Application info, responses: {'200': {description: Info}}}
  /actuator/metrics:
    get: {tags: [Operations], summary: Metrics, responses: {'200': {description: Metric names}}}
  /actuator/prometheus:
    get: {tags: [Operations], summary: Prometheus metrics, responses: {'200': {description: Metrics text}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    WardId: {name: wardId, in: path, required: true, schema: {type: string, format: uuid}}
    CitizenId: {name: citizenId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    LoginRequest: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, format: password}}}
    RefreshTokenRequest: {type: object, required: [refreshToken], properties: {refreshToken: {type: string}}}
    LogoutRequest: {type: object, required: [refreshToken], properties: {refreshToken: {type: string}}}
    GenericRequest: {type: object, additionalProperties: true}
    CitizenRegistrationRequest:
      type: object
      required: [wardId, nid, citizenshipNo, nameNp, nameEn, dob, sex, consentChannel]
      properties:
        wardId: {type: string, format: uuid}
        nid: {type: string}
        citizenshipNo: {type: string}
        nameNp: {type: string, maxLength: 300}
        nameEn: {type: string, maxLength: 300}
        dob: {type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$'}
        sex: {type: string, enum: [MALE, FEMALE, OTHER]}
        consentChannel: {type: string}
        passportNo: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
        deviceId: {type: string}
        localRecordId: {type: string, format: uuid}
  
security:
  - bearerAuth: []