name: CI

on:
  push:
    branches:
      - main
      - develop
      - dev
  pull_request:
    branches:
      - main
      - develop
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MAVEN_OPTS: -Dmaven.repo.local=$GITHUB_WORKSPACE/.m2/repository
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/digital-nepal-backend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean install -DskipTests

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: production-app
          path: modules/stub-backend/target/production-app.jar

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  docker-build:
    needs: build-backend
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.ref_name == 'develop' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download production JAR
        uses: actions/download-artifact@v4
        with:
          name: production-app
          path: .

      - name: Rename downloaded JAR for runtime build
        run: |
          if [ -f production-app/production-app.jar ]; then
            mv production-app/production-app.jar app.jar
          elif [ -f production-app.jar ]; then
            mv production-app.jar app.jar
          fi
          ls -la

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.ref_name == 'develop'
    steps:
      - name: Manual staging deploy placeholder
        run: echo "Manual staging deploy"
